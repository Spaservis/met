<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0A3D62"><meta name="description" content="Portafolio académico y tecnológico con acceso mediante códigos QR, proyectos digitales y navegación integrada Spaservis."><title>Portafolio Académico & Salud | Spaservis QR</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>:root { --azul: #0A3D62; --azul-oscuro: #062744; --dorado: #D4AF37; --turquesa: #1ABC9C; --fondo: #F1F5F9; --blanco: #FFFFFF; --texto: #172033; --borde: #D9E2EC; --sombra: 0 12px 35px rgba(10,61,98,.13);}* { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif;}html { scroll-behavior: smooth; scroll-padding-top: 85px;}body { min-height: 100vh; min-height: 100dvh; background: var(--fondo); color: var(--texto); overflow-x: hidden; padding-bottom: 65px;}button, a { -webkit-tap-highlight-color: transparent;}button { cursor: pointer;}button:focus-visible,a:focus-visible { outline: 3px solid var(--dorado); outline-offset: 4px;}/* ========================================== NAVEGACIÓN GLOBAL SPASERVIS Estilos aislados para evitar conflictos con el CSS del portafolio.========================================== */#global-navigation { --nav-bg: rgba(6, 39, 68, .98); --nav-text: #fff; --nav-accent: #1ABC9C; position: sticky; top: 0; z-index: 9999; width: 100%; color: var(--nav-text); background: var(--nav-bg); border-bottom: 3px solid var(--dorado); box-shadow: 0 4px 18px rgba(0,0,0,.2); backdrop-filter: blur(10px);}#global-navigation,#global-navigation * { box-sizing: border-box;}#global-navigation .nav-container { width: 100%; max-width: 1200px; min-height: 60px; margin: auto; padding: 9px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px;}#global-navigation .nav-logo { display: inline-flex; align-items: center; gap: 8px; color: var(--nav-accent); font-size: 16px; font-weight: 800; text-decoration: none; white-space: nowrap;}#global-navigation .nav-links { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 5px;}#global-navigation .nav-item { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 9px 10px; border-radius: 8px; color: var(--nav-text); font-size: 12px; line-height: 1.4; text-decoration: none; transition: background .2s, color .2s;}#global-navigation .nav-item:hover,#global-navigation .nav-item.active { color: var(--azul-oscuro); background: var(--nav-accent); font-weight: 800;}#global-navigation .nav-item.external::after { content: "↗"; font-size: 11px;}#global-navigation .nav-toggle { display: none; flex-shrink: 0; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; border: 1px solid var(--nav-accent); border-radius: 10px; background: transparent; color: var(--nav-accent); font-size: 22px;}#global-navigation .nav-item:focus-visible,#global-navigation .nav-toggle:focus-visible,#global-navigation .nav-logo:focus-visible { outline: 3px solid var(--dorado); outline-offset: 3px;}@media (max-width: 900px) { #global-navigation .nav-container { flex-wrap: wrap; } #global-navigation .nav-toggle { display: inline-flex; } #global-navigation .nav-links { display: none; flex-basis: 100%; width: 100%; flex-direction: column; align-items: stretch; padding: 7px 0; gap: 5px; } #global-navigation .nav-links.show { display: flex; } #global-navigation .nav-item { justify-content: flex-start; width: 100%; padding: 12px; font-size: 13px; }}/* ========================================== CABECERA DEL PORTAFOLIO========================================== */.header { position: relative; overflow: hidden; background: linear-gradient(125deg, var(--azul-oscuro), var(--azul)); color: white; padding: 22px clamp(16px, 4vw, 42px); border-bottom: 4px solid var(--dorado);}.header::before,.header::after { content: ""; position: absolute; border: 1px solid rgba(255,255,255,.09); border-radius: 50%; pointer-events: none;}.header::before { width: 230px; height: 230px; right: -60px; top: -150px;}.header::after { width: 180px; height: 180px; right: 90px; bottom: -150px;}.header-content { position: relative; z-index: 1; max-width: 1200px; margin: auto;}.header h1 { color: var(--dorado); font-size: clamp(21px, 3vw, 32px); letter-spacing: .4px; line-height: 1.3;}.header p { font-size: 13px; line-height: 1.6; margin-top: 7px; color: #E2EAF2;}.badges { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px;}.badge { display: inline-flex; align-items: center; border: 1px solid rgba(212,175,55,.8); background: rgba(255,255,255,.08); border-radius: 30px; padding: 6px 11px; font-size: 11px; color: white;}/* ========================================== CARRUSEL QR========================================== */.main { max-width: 1200px; margin: auto; padding: 20px 0 0;}.section-heading { padding: 0 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px;}.section-heading h2 { font-size: clamp(17px, 2.5vw, 22px); color: var(--azul);}.counter { background: #E2EAF2; color: var(--azul); padding: 7px 12px; border-radius: 25px; font-size: 12px; font-weight: 700;}.carousel-container { position: relative; width: 100%; overflow: hidden; touch-action: pan-y pinch-zoom;}.carousel-track { display: flex; align-items: stretch; transition: transform .38s ease; will-change: transform;}.card { flex: 0 0 85%; min-width: 0; margin: 8px 7.5%; padding: clamp(18px, 4vw, 32px); background: var(--blanco); border: 2px solid var(--azul); border-radius: 22px; box-shadow: var(--sombra); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 13px; position: relative;}.card[aria-hidden="true"] { pointer-events: none;}.card-icon { width: 66px; height: 66px; display: grid; place-items: center; font-size: 34px; border-radius: 20px; background: #EAF2F8; border: 1px solid #D9E8F4;}.card h3 { color: var(--azul); font-size: clamp(18px, 3vw, 24px); line-height: 1.35; overflow-wrap: anywhere;}.card-description { color: #64748B; font-size: 13px; line-height: 1.5;}.url { display: block; width: 100%; max-width: 450px; padding: 10px 12px; color: var(--azul); background: #F8FAFC; border: 1px solid var(--borde); border-radius: 10px; font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; text-decoration: none;}.qr-box { width: min(240px, 75vw); height: min(240px, 75vw); min-width: 160px; min-height: 160px; padding: 12px; border: 2px dashed var(--turquesa); border-radius: 17px; background: white; display: flex; align-items: center; justify-content: center; margin: 4px auto;}.qr-box img,.qr-box canvas { display: block; max-width: 100%; max-height: 100%; height: auto; width: auto; image-rendering: pixelated;}.qr-caption { font-size: 11px; color: #64748B;}.card-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; width: 100%; margin-top: 4px;}.btn { display: inline-flex; justify-content: center; align-items: center; gap: 7px; min-height: 43px; padding: 11px 15px; border: 0; border-radius: 11px; font-size: 12px; font-weight: 700; text-decoration: none; transition: transform .2s, filter .2s;}.btn:hover { filter: brightness(1.06); transform: translateY(-1px);}.btn-primary { background: var(--azul); color: white;}.btn-gold { background: var(--dorado); c
