<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A3D62">
  <meta name="description" content="Portafolio académico y tecnológico con acceso mediante códigos QR, proyectos digitales y navegación integrada Spaservis.">
  <title>Portafolio Académico & Salud | Spaservis QR 3D</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    :root {
      /* Estilos Originales Portafolio Spaservis */
      --azul: #0A3D62;
      --azul-oscuro: #062744;
      --dorado: #D4AF37;
      --turquesa: #1ABC9C;
      --blanco: #FFFFFF;
      --texto-oscuro: #172033;
      --borde: #D9E2EC;
      --sombra: 0 12px 35px rgba(10,61,98,.13);
      
      /* Integración Nueva Propuesta Fondo 1 */
      --fondo-base: #0a192f; 
      --texto-claro: #F1F5F9;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      font-family: "Segoe UI", Arial, sans-serif;
    }

    html { 
      scroll-behavior: smooth; 
      scroll-padding-top: 85px;
    }

    body { 
      min-height: 100vh; 
      background: var(--fondo-base); 
      color: var(--texto-claro); 
      overflow-x: hidden; 
      padding-bottom: 65px;
      position: relative;
      perspective: 1000px; /* Activa la perspectiva 3D global */
    }

    button, a { 
      -webkit-tap-highlight-color: transparent;
    }

    button { 
      cursor: pointer;
    }

    button:focus-visible, a:focus-visible { 
      outline: 3px solid var(--dorado); 
      outline-offset: 4px;
    }

    /* ========================================== 
       ENTORNO Y PLANO 3D TRASERO (FONDO 1)
    ========================================== */
    #background-3d-universe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1; /* Estrictamente detrás de toda la interfaz */
      pointer-events: none;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    /* Malla tridimensional inclinada */
    .grid-plane {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background-image: 
        linear-gradient(rgba(26, 188, 156, 0.05) 2px, transparent 2px),
        linear-gradient(90deg, rgba(26, 188, 156, 0.05) 2px, transparent 2px);
      background-size: 50px 50px;
      transform: rotateX(60deg) rotateZ(-15deg) translateZ(-150px);
      opacity: 0.7;
    }

    /* El espécimen (Lagartija) animada en el espacio 3D */
    .lizard-specimen {
      position: absolute;
      width: 120px;
      height: auto;
      top: 40%;
      left: -150px;
      transform-style: preserve-3d;
      animation: crawl3D 25s infinite linear;
    }

    @keyframes crawl3D {
      0% { transform: translate3d(0vw, 20vh, -200px) rotateZ(45deg); }
      30% { transform: translate3d(40vw, -10vh, -50px) rotateZ(60deg); }
      60% { transform: translate3d(70vw, 40vh, -300px) rotateZ(-20deg); }
      100% { transform: translate3d(120vw, 10vh, -100px) rotateZ(35deg); }
    }

    /* Orbes decorativos flotantes */
    .floating-orb {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(10,61,98,0.4) 0%, transparent 70%);
      border-radius: 50%;
      top: 20%;
      right: 10%;
      transform: translateZ(-400px);
    }

    /* ========================================== 
       NAVEGACIÓN GLOBAL SPASERVIS 
    ========================================== */
    #global-navigation { 
      --nav-bg: rgba(6, 39, 68, 0.98); 
      --nav-text: #fff; 
      --nav-accent: #1ABC9C; 
      position: sticky; 
      top: 0; 
      z-index: 9999; 
      width: 100%; 
      color: var(--nav-text); 
      background: var(--nav-bg); 
      border-bottom: 3px solid var(--dorado); 
      box-shadow: 0 4px 18px rgba(0,0,0,.2); 
      backdrop-filter: blur(10px);
    }

    #global-navigation, #global-navigation * { 
      box-sizing: border-box;
    }

    #global-navigation .nav-container { 
      width: 100%; 
      max-width: 1200px; 
      min-height: 60px; 
      margin: auto; 
      padding: 9px 18px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      gap: 14px;
    }

    #global-navigation .nav-logo { 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      color: var(--nav-accent); 
      font-size: 16px; 
      font-weight: 800; 
      text-decoration: none; 
      white-space: nowrap;
    }

    #global-navigation .nav-links { 
      display: flex; 
      align-items: center; 
      justify-content: flex-end; 
      flex-wrap: wrap; 
      gap: 5px;
    }

    #global-navigation .nav-item { 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 4px; 
      padding: 9px 10px; 
      border-radius: 8px; 
      color: var(--nav-text); 
      font-size: 12px; 
      line-height: 1.4; 
      text-decoration: none; 
      transition: background .2s, color .2s;
    }

    #global-navigation .nav-item:hover, #global-navigation .nav-item.active { 
      color: var(--azul-oscuro); 
      background: var(--nav-accent); 
      font-weight: 800;
    }

    #global-navigation .nav-item.external::after { 
      content: "↗"; 
      font-size: 11px;
    }

    #global-navigation .nav-toggle { 
      display: none; 
      flex-shrink: 0; 
      align-items: center; 
      justify-content: center; 
      min-width: 44px; 
      min-height: 44px; 
      border: 1px solid var(--nav-accent); 
      border-radius: 10px; 
      background: transparent; 
      color: var(--nav-accent); 
      font-size: 22px;
    }

    #global-navigation .nav-item:focus-visible, 
    #global-navigation .nav-toggle:focus-visible, 
    #global-navigation .nav-logo:focus-visible { 
      outline: 3px solid var(--dorado); 
      outline-offset: 3px;
    }

    @media (max-width: 900px) { 
      #global-navigation .nav-container { flex-wrap: wrap; } 
      #global-navigation .nav-toggle { display: inline-flex; } 
      #global-navigation .nav-links { display: none; flex-basis: 100%; width: 100%; flex-direction: column; align-items: stretch; padding: 7px 0; gap: 5px; } 
      #global-navigation .nav-links.show { display: flex; } 
      #global-navigation .nav-item { justify-content: flex-start; width: 100%; padding: 12px; font-size: 13px; }
    }

    /* ========================================== 
       CAPAS SUPERIORES DE INTERFAZ PORTAFOLIO
    ========================================== */
    .interface-wrapper {
      position: relative;
      z-index: 10; /* Eleva la legibilidad sobre el fondo 3D */
    }

    .header { 
      position: relative; 
      overflow: hidden; 
      background: linear-gradient(125deg, rgba(6, 39, 68, 0.9), rgba(10, 61, 98, 0.9)); 
      backdrop-filter: blur(8px);
      color: white; 
      padding: 22px clamp(16px, 4vw, 42px); 
      border-bottom: 4px solid var(--dorado);
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }

    .header-content { 
      position: relative; 
      z-index: 1; 
      max-width: 1200px; 
      margin: auto;
    }

    .header h1 { 
      color: var(--dorado); 
      font-size: clamp(21px, 3vw, 32px); 
      letter-spacing: .4px; 
      line-height: 1.3;
    }

    .header p { 
      font-size: 13px; 
      line-height: 1.6; 
      margin-top: 7px; 
      color: #E2EAF2;
    }

    .badges { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 7px; 
      margin-top: 14px;
    }

    .badge { 
      display: inline-flex; 
      align-items: center; 
      border: 1px solid rgba(212,175,55,.8); 
      background: rgba(255,255,255,.08); 
      border-radius: 30px; 
      padding: 6px 11px; 
      font-size: 11px; 
      color: white;
    }

    /* ========================================== 
       CARRUSEL Y TARJETAS PORTAFOLIO
    ========================================== */
    .main { 
      max-width: 1200px; 
      margin: auto; 
      padding: 20px 0 0;
    }

    .section-heading { 
      padding: 0 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 12px; 
      flex-wrap: wrap; 
      margin-bottom: 14px;
    }

    .section-heading h2 { 
      font-size: clamp(17px, 2.5vw, 22px); 
      color: var(--dorado); /* Cambiado a dorado para destacar sobre el fondo oscuro */
    }

    .counter { 
      background: rgba(226, 234, 242, 0.2); 
      color: var(--texto-claro); 
      padding: 7px 12px; 
      border-radius: 25px; 
      font-size: 12px; 
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .carousel-container { 
      position: relative; 
      width: 100%; 
      overflow: hidden; 
      touch-action: pan-y pinch-zoom;
    }

    .carousel-track { 
      display: flex; 
      align-items: stretch; 
      transition: transform .38s ease; 
      will-change: transform;
    }

    .card { 
      flex: 0 0 85%; 
      min-width: 0; 
      margin: 8px 7.5%; 
      padding: clamp(18px, 4vw, 32px); 
      background: rgba(255, 255, 255, 0.96); /* Opacidad alta para lectura nítida de QR */
      color: var(--texto-oscuro);
      border: 2px solid var(--azul); 
      border-radius: 22px; 
      box-shadow: 0 20px 45px rgba(0,0,0,0.5); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      text-align: center; 
      gap: 13px; 
      position: relative;
    }

    .card[aria-hidden="true"] { 
      pointer-events: none;
    }

    .card-icon { 
      width: 66px; 
      height: 66px; 
      display: grid; 
      place-items: center; 
      font-size: 34px; 
      border-radius: 20px; 
      background: #EAF2F8; 
      border: 1px solid #D9E8F4;
    }

    .card h3 { 
      color: var(--azul); 
      font-size: clamp(18px, 3vw, 24px); 
      line-height: 1.35; 
      overflow-wrap: anywhere;
